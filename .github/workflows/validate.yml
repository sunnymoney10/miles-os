name: SIDEQUEST baseline validation

on:
  pull_request:
  push:
    branches:
      - main
      - sidequest/source-baseline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
